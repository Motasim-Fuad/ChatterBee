workflows:
  android-ios-release:
    name: Android + iOS Release Build
    max_build_duration: 40
    instance_type: mac_mini_m4

    environment:
      flutter: stable
      groups:
        - chatterbee
      vars:
        ANDROID_PACKAGE_NAME: "com.chatterbee.app"
        IOS_BUNDLE_ID: "com.example.chatterBee"

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Run tests
        script: flutter test

      #ANDROID SIGNING
      - name: Decode keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > keystore.jks

      - name: Create key.properties
        script: |
          cat <<EOF > android/key.properties
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=../keystore.jks
          EOF

      - name: Move keystore
        script: mv keystore.jks android/

      #CREATE .env FILE
      - name: Create .env file
        script: |
          printf 'RC_ANDROID_PUBLIC_KEY=%s\nRC_IOS_PUBLIC_KEY=%s\n' \
            "$RC_ANDROID_PUBLIC_KEY" \
            "$RC_IOS_PUBLIC_KEY" > .env

      #ANDROID BUILD
      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --build-name=${CM_TAG#v} \
            --build-number=$BUILD_NUMBER \
            --dart-define-from-file=.env

      #iOS SIGNING
      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Fetch iOS signing files
        script: |
          app-store-connect fetch-signing-files $IOS_BUNDLE_ID \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create

      - name: Add signing certificate to keychain
        script: |
          keychain add-certificates

      #iOS BUILD
      - name: Build IPA
        script: |
          xcode-project use-profiles
          flutter build ipa --release \
            --build-name=${CM_TAG#v} \
            --build-number=$BUILD_NUMBER \
            --dart-define-from-file=.env

    artifacts:
      - build/**/outputs/**/*.aab
      - build/ios/ipa/*.ipa

    publishing:
      #GOOGLE PLAY
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
        changes_not_sent_for_review: true

      #TESTFLIGHT
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

      email:
        recipients:
          - motasimfuad99@gmail.com
        notify:
          success: true
          failure: true